<!-- html-channel chat widget DOM (injected before </body>; read per-request → hot-reloadable).
     Embedded DOCKED right-side column (v0.3.6): part of the page layout (reflows content,
     mirrors the left sidebar), not a floating overlay. Collapse hides it to the right-edge tab. -->
<button id="hc-tab" title="open page chat">CHAT ◂</button>
<div id="hc-panel">
  <div id="hc-head">
    <span>page chat<span class="dot" id="hc-dot"></span></span>
    <span class="hc-btns">
      <button id="hc-collapse" title="hide (reading mode)">—</button>
    </span>
  </div>
  <div id="hc-log"></div>
  <form id="hc-form">
    <textarea id="hc-input" rows="3" placeholder="message…  (Enter ↵ send · Shift+Enter newline)" autocomplete="off"></textarea>
    <button id="hc-send" type="submit">Send</button>
  </form>
</div>
